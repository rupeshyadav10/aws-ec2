AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Highly available web hosting on EC2 - two Apache servers bootstrapped with User Data
  behind an Application Load Balancer with health checks, an admin server with an
  Elastic IP, an S3 bucket for log backups, IAM role and CloudWatch alarm.
  Author: Rupesh Kumar Yadav

# NOTE: infrastructure/template.yaml is GENERATED from this file by build_template.py
# (it injects scripts/bootstrap-userdata.sh). Edit this base file, then re-run the builder.

Parameters:
  ProjectName:
    Type: String
    Default: ec2-ha-web
    AllowedPattern: "^[a-z0-9-]{3,24}$"
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH (Day 3).
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different Availability Zones.
  AdminCidr:
    Type: String
    Description: Your public IP in CIDR form (e.g. 203.0.113.10/32). Only this range may SSH in.
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro, t3.small]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # ---------------- S3: log backups (Day 1) ----------------
  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-logs
            Status: Enabled
            Prefix: logs/
            ExpirationInDays: 30

  # ---------------- Security groups (Day 3) ----------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer - HTTP from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP from anywhere }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-alb-sg" }]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web servers - HTTP only from the load balancer, SSH only from admin IP
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: HTTP from ALB only }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: SSH from admin IP }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-web-sg" }]

  AdminSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Admin server - SSH from admin IP
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: SSH from admin IP }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-admin-sg" }]

  # ---------------- IAM role for the web servers ----------------
  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # optional browser-based shell (Session Manager)
      Policies:
        - PolicyName: UploadLogsToBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BackupBucket.Arn}/logs/*"

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebInstanceRole]

  # ---------------- Launch template with bootstrap script (Day 4) ----------------
  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-web-lt"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds: [!Ref WebSecurityGroup]
        IamInstanceProfile: { Arn: !GetAtt WebInstanceProfile.Arn }
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }   # IMDSv2 only
        UserData:
          Fn::Base64: !Sub |
__USERDATA__

  # ---------------- Two web servers in different AZs (Days 2-4) ----------------
  WebServer1:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: !Select [0, !Ref SubnetIds]
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-web-1" }]

  WebServer2:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: !Select [1, !Ref SubnetIds]
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-web-2" }]

  # ---------------- Admin server + Elastic IP (Day 5) ----------------
  AdminServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds: [!Ref AdminSecurityGroup]
      MetadataOptions: { HttpTokens: required }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-admin" }]

  AdminElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-admin-eip" }]

  AdminElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt AdminElasticIp.AllocationId
      InstanceId: !Ref AdminServer

  # ---------------- Load balancer + health checks (Day 6) ----------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health.html
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
      Targets:
        - { Id: !Ref WebServer1, Port: 80 }
        - { Id: !Ref WebServer2, Port: 80 }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  # ---------------- Monitoring ----------------
  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-unhealthy-hosts"
      AlarmDescription: At least one web server failed its health check
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  WebsiteUrl:
    Description: Open this in your browser (load balancer DNS name)
    Value: !Sub "http://${LoadBalancer.DNSName}"
  AdminElasticIp:
    Description: Static public IP of the admin server (SSH here)
    Value: !Ref AdminElasticIp
  WebServer1Id:
    Value: !Ref WebServer1
  WebServer2Id:
    Value: !Ref WebServer2
  BackupBucketName:
    Value: !Ref BackupBucket
  TargetGroupArn:
    Value: !Ref TargetGroup
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
  InstanceProfileName:
    Value: !Ref WebInstanceProfile
